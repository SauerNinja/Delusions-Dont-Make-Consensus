<svg width="900" height="1100" viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gA" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FBB040"/><stop offset="50%" stop-color="#F7931A"/><stop offset="100%" stop-color="#8A3E10"/></linearGradient>
<linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F7931A"/><stop offset="50%" stop-color="#B85C14"/><stop offset="100%" stop-color="#5C2A0C"/></linearGradient>
<linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C96A16"/><stop offset="50%" stop-color="#7A3B12"/><stop offset="100%" stop-color="#3A1B08"/></linearGradient>
<linearGradient id="gD" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9C4A0F"/><stop offset="50%" stop-color="#5C2A0C"/><stop offset="100%" stop-color="#2A1005"/></linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B7A45"/>
      <stop offset="100%" stop-color="#39421F"/>
    </linearGradient>
    <radialGradient id="vign" cx="48%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#1C1710" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0806" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1100" fill="#14110D"/>

  <!-- Stem: rises straight, then hooks over sharply at the top,
       the defining silhouette of a wilted rose, bent by its own dead weight -->
  <path d="M 420 1010 C 420 780 425 560 435 420 C 442 340 452 290 430 260 C 408 232 372 240 358 275"
        fill="none" stroke="url(#stemGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 420 1010 C 420 780 425 560 435 420 C 442 340 452 290 430 260 C 408 232 372 240 358 275"
        fill="none" stroke="#232917" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <!-- thorns along the upright part of the stem -->
  <path d="M 428 620 L 398 636 L 432 640 Z" fill="#3C4522"/>
  <path d="M 438 460 L 408 472 L 442 480 Z" fill="#3C4522"/>
  <path d="M 424 800 L 394 812 L 428 820 Z" fill="#3C4522"/>

  <!-- dried leaves off the stem -->
  <path d="M 432 700 C 380 690 340 708 320 744 C 356 746 400 736 432 700 Z" fill="#5A4A22" opacity="0.85"/>
  <path d="M 432 700 C 380 690 340 708 320 744" fill="none" stroke="#3C3018" stroke-width="2" opacity="0.6"/>
  <path d="M 424 880 C 372 872 332 890 312 926 C 348 928 392 916 424 880 Z" fill="#4E4020" opacity="0.85"/>
  <path d="M 424 880 C 372 872 332 890 312 926" fill="none" stroke="#3C3018" stroke-width="2" opacity="0.6"/>

  <!-- calyx / sepals right at the neck where the head hangs -->
  <g transform="translate(358,275)">
    <path d="M -8 0 C -32 18 -40 42 -26 62 C -14 46 -8 24 -8 0 Z" fill="#4A5A2A" opacity="0.9"/>
    <path d="M 6 -4 C 26 10 34 34 22 56 C 10 40 4 18 6 -4 Z" fill="#39421F" opacity="0.9"/>
  </g>

  <!-- the drooping bloom itself, hanging from the hook of the stem -->
  <g transform="translate(433.7,336.4) rotate(175.0)"><path d="M 0 0 C -33.349999999999994 -16.56 -44.95 -57.04 0 -92.0 C 44.95 -57.04 33.349999999999994 -16.56 0 0 Z" fill="url(#gB)"/></g>
<g transform="translate(426.3,336.4) rotate(235.0)"><path d="M 0 0 C -33.349999999999994 -16.56 -44.95 -57.04 0 -92.0 C 44.95 -57.04 33.349999999999994 -16.56 0 0 Z" fill="url(#gB)"/></g>
<g transform="translate(422.6,330.0) rotate(295.0)"><path d="M 0 0 C -33.349999999999994 -16.56 -44.95 -57.04 0 -92.0 C 44.95 -57.04 33.349999999999994 -16.56 0 0 Z" fill="url(#gB)"/></g>
<g transform="translate(434.0,334.8) rotate(155.0)"><path d="M 0 0 C -28.749999999999996 -14.04 -37.5 -48.36 0 -78.0 C 37.5 -48.36 28.749999999999996 -14.04 0 0 Z" fill="url(#gA)"/></g>
<g transform="translate(427.4,335.7) rotate(220.0)"><path d="M 0 0 C -28.749999999999996 -14.04 -37.5 -48.36 0 -78.0 C 37.5 -48.36 28.749999999999996 -14.04 0 0 Z" fill="url(#gA)"/></g>
<g transform="translate(423.8,330.0) rotate(285.0)"><path d="M 0 0 C -28.749999999999996 -14.04 -37.5 -48.36 0 -78.0 C 37.5 -48.36 28.749999999999996 -14.04 0 0 Z" fill="url(#gA)"/></g>
<g transform="translate(432.5,334.3) rotate(160.0)"><path d="M 0 0 C -23.0 -11.16 -28.4 -38.44 0 -62.0 C 28.4 -38.44 23.0 -11.16 0 0 Z" fill="url(#gC)"/></g>
<g transform="translate(427.9,334.5) rotate(215.0)"><path d="M 0 0 C -23.0 -11.16 -28.4 -38.44 0 -62.0 C 28.4 -38.44 23.0 -11.16 0 0 Z" fill="url(#gC)"/></g>
<g transform="translate(425.1,330.9) rotate(270.0)"><path d="M 0 0 C -23.0 -11.16 -28.4 -38.44 0 -62.0 C 28.4 -38.44 23.0 -11.16 0 0 Z" fill="url(#gC)"/></g>
<g transform="translate(431.2,333.3) rotate(165.0)"><path d="M 0 0 C -17.25 -7.92 -19.8 -27.28 0 -44.0 C 19.8 -27.28 17.25 -7.92 0 0 Z" fill="url(#gB)"/></g>
<g transform="translate(427.0,331.8) rotate(245.0)"><path d="M 0 0 C -17.25 -7.92 -19.8 -27.28 0 -44.0 C 19.8 -27.28 17.25 -7.92 0 0 Z" fill="url(#gB)"/></g>
<g transform="translate(430.5,332.0) rotate(165.0)"><path d="M 0 0 C -11.5 -4.68 -12.5 -16.12 0 -26.0 C 12.5 -16.12 11.5 -4.68 0 0 Z" fill="url(#gD)"/></g>
<g transform="translate(428.5,331.5) rotate(225.0)"><path d="M 0 0 C -11.5 -4.68 -12.5 -16.12 0 -26.0 C 12.5 -16.12 11.5 -4.68 0 0 Z" fill="url(#gD)"/></g>

  <!-- a couple of loose fallen petals near the base for the "wilted" tell -->
  <ellipse cx="330" cy="1050" rx="24" ry="13" fill="url(#gC)" opacity="0.7" transform="rotate(-15 330 1050)"/>
  <ellipse cx="290" cy="1068" rx="18" ry="10" fill="url(#gD)" opacity="0.6" transform="rotate(20 290 1068)"/>

  <rect width="900" height="1100" fill="url(#vign)"/>
</svg>
