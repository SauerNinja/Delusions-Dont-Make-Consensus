<svg width="900" height="1100" viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBB040"/>
      <stop offset="45%" stop-color="#F7931A"/>
      <stop offset="100%" stop-color="#8A3E10"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7931A"/>
      <stop offset="55%" stop-color="#B85C14"/>
      <stop offset="100%" stop-color="#5C2A0C"/>
    </linearGradient>
    <linearGradient id="petalGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C96A16"/>
      <stop offset="100%" stop-color="#4A2209"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C6B3E"/>
      <stop offset="100%" stop-color="#39421F"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1C1710" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E0B08" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- stem, curved and drooping -->
  <path d="M 460 260 C 430 420 380 560 340 680 C 300 800 250 900 205 1010"
        fill="none" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 460 260 C 430 420 380 560 340 680 C 300 800 250 900 205 1010"
        fill="none" stroke="#232917" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- thorns -->
  <path d="M 420 430 L 392 448 L 424 448 Z" fill="#3C4522"/>
  <path d="M 372 610 L 342 622 L 376 630 Z" fill="#3C4522"/>
  <path d="M 305 800 L 274 806 L 308 822 Z" fill="#3C4522"/>

  <!-- dried leaves -->
  <path d="M 400 520 C 350 505 310 520 288 555 C 320 560 365 555 400 520 Z" fill="#6B5A2E" opacity="0.85"/>
  <path d="M 400 520 C 350 505 310 520 288 555" fill="none" stroke="#463A1D" stroke-width="2" opacity="0.7"/>
  <path d="M 330 700 C 280 695 245 715 228 752 C 262 752 305 738 330 700 Z" fill="#5A4A22" opacity="0.85"/>
  <path d="M 330 700 C 280 695 245 715 228 752" fill="none" stroke="#3C3018" stroke-width="2" opacity="0.7"/>

  <!-- fallen petals near base -->
  <ellipse cx="190" cy="1040" rx="26" ry="14" fill="url(#petalGradDark)" opacity="0.8" transform="rotate(-20 190 1040)"/>
  <ellipse cx="150" cy="1060" rx="20" ry="11" fill="url(#petalGradDark)" opacity="0.7" transform="rotate(15 150 1060)"/>

  <!-- rose head: bowed forward, so we build it centered around ~500,190 tilted down -->
  <g transform="translate(500,200) rotate(18)">
    <!-- outer wilted petals, drooping and curled -->
    <path d="M -20 -10 C -110 -30 -170 20 -175 90 C -170 150 -110 175 -50 160 C -80 130 -95 80 -80 30 C -70 -5 -45 -10 -20 -10 Z" fill="url(#petalGrad2)"/>
    <path d="M 10 -20 C 90 -55 160 -25 180 40 C 195 100 155 145 95 145 C 120 105 125 55 100 15 C 80 -15 45 -22 10 -20 Z" fill="url(#petalGrad1)"/>
    <path d="M -30 20 C -60 70 -55 130 -5 165 C 20 182 55 178 70 155 C 30 150 0 120 -5 75 C -8 50 -15 30 -30 20 Z" fill="url(#petalGradDark)"/>

    <!-- mid petals curling inward, drooping down -->
    <path d="M -5 -35 C -55 -35 -85 5 -80 55 C -76 95 -45 115 -5 105 C -35 85 -45 55 -35 25 C -28 5 -18 -15 -5 -35 Z" fill="url(#petalGrad1)"/>
    <path d="M 15 -35 C 60 -40 90 -5 88 40 C 86 78 55 100 20 92 C 45 72 52 45 44 18 C 38 -2 28 -20 15 -35 Z" fill="url(#petalGrad2)"/>
    <path d="M 0 10 C -20 40 -15 75 15 92 C 32 101 50 96 55 82 C 30 78 15 58 15 35 C 15 24 8 15 0 10 Z" fill="#7A3B12"/>

    <!-- inner curled bud, tightest and darkest -->
    <path d="M -8 -12 C -30 -8 -40 12 -30 32 C -22 48 -2 52 10 42 C -4 38 -12 24 -8 8 C -6 0 -2 -8 -8 -12 Z" fill="#5C2A0C"/>
    <path d="M 6 -14 C 24 -16 36 -2 32 16 C 29 30 14 38 2 32 C 14 26 18 12 12 0 C 9 -6 2 -12 6 -14 Z" fill="#F7931A" opacity="0.9"/>
    <circle cx="-2" cy="10" r="6" fill="#3A1B08"/>

    <!-- calyx / sepals at base of bloom -->
    <path d="M -30 60 C -45 90 -40 120 -15 135 C -25 105 -25 78 -10 55 Z" fill="#4A5A2A" opacity="0.9"/>
    <path d="M 25 65 C 45 90 42 118 15 132 C 28 105 30 80 15 58 Z" fill="#39421F" opacity="0.9"/>
  </g>

  <!-- subtle vignette to seat the illustration -->
  <rect x="0" y="0" width="900" height="1100" fill="url(#vign)"/>
</svg>
